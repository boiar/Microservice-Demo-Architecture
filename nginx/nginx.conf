worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------------
    # Upstream: Spring Boot API Gateway (application layer)
    # 3 explicitly named replicas — Nginx resolves these at startup, so
    # they must be defined as separate services (not `docker compose --scale`)
    # in micro-services/springboot-api-gateway/gateway-stack.yml
    # ---------------------------------------------------------------------
    upstream api_gateway {
        least_conn;  # send next request to the instance with fewest active connections

        server api-gateway-1:8080 max_fails=3 fail_timeout=30s;
        server api-gateway-2:8080 max_fails=3 fail_timeout=30s;
        server api-gateway-3:8080 max_fails=3 fail_timeout=30s;

        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Forward everything to the API Gateway
        location / {
            proxy_pass http://api_gateway;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Passive health check passthrough to the gateway's actuator endpoint
        location /health {
            access_log off;
            proxy_pass http://api_gateway/actuator/health;
        }
    }

    # ---------------------------------------------------------------------
    # HTTPS (disabled for now — plain HTTP for local/dev)
    # Uncomment and supply real certs when moving to TLS termination here.
    # ---------------------------------------------------------------------
    # server {
    #     listen 443 ssl;
    #     server_name api.yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #
    #     location / {
    #         proxy_pass http://api_gateway;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}